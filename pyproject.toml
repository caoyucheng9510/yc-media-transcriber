[project]
name = "yc-media-transcriber"
version = "0.1.0"
description = "Local single-user media transcription service for Mac and Docker."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "psutil>=5.9.0",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.0",
  "uvicorn[standard]>=0.30.0",
  "yt-dlp>=2025.5.22",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.2.0",
  "modelscope>=1.15.0",
  "torch>=2.2.0",
  "torchaudio>=2.2.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
